<body>

<div class="app">

  <button class="sb-reopen" id="btnReopen" title="显示项目列表">项目</button>

  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <span>项目列表</span>
      <span class="side-head-btns">
        <button id="btnNewProj" title="新建一个空白项目">+ 新建</button>
        <button id="btnFoldSide" class="icon-btn" title="收起侧栏">‹</button>
      </span>
    </div>

    <div class="side-filter">
      <input id="searchBox" class="field" type="search" placeholder="搜索任务名 / 负责人" autocomplete="off">
      <select id="ownerFilter" class="field">
        <option value="">全部负责人</option>
      </select>
    </div>

    <div class="proj-list" id="projList"></div>

    <div class="side-foot">
      <button id="btnExportAll" title="导出全部项目为一个 JSON">导出全部</button>
      <label for="fImpAll" title="导入全部项目的 JSON">导入 JSON</label>
      <input type="file" id="fImpAll" accept=".json,application/json" hidden>
    </div>
  </aside>

  <main class="main">
    <div class="sheet">

      <div class="toolbar row1">
        <button class="ghost" id="btnToggleSidebar" title="显示/隐藏左侧项目列表 (Ctrl+B)">☰ 项目</button>
        <button class="primary" id="btnAdd" title="在末尾新增一条任务">+ 新增任务</button>
        <span class="tb-sep"></span>
        <button id="btnUndo" title="撤销上一步 (Ctrl+Z)">↶ 撤销</button>
        <button id="btnRedo" title="重做 (Ctrl+Y)">↷ 重做</button>
        <span class="tb-sep"></span>
        <button id="btnCascade" title="保持各任务工期不变，从第一个任务的开始日依次往后顺延">自动顺延排期</button>
        <button id="btnSort" title="按开始日期由早到晚排列">按开始日期排序</button>
        <button id="btnDupProj" title="复制当前项目（含任务、备注、显示设置），便于以此为模板修改">⧉ 复制项目</button>
        <button id="btnFit" title="自动选择每格天数与日宽，让全部内容在当前屏幕一次显示完，方便打印">▣ 适屏显示</button>
        <span class="spacer"></span>
        <button class="menu-btn" id="btnDataMenu" title="导入与导出">⇅ 导入 / 导出</button>
        <button class="menu-btn" id="btnViewMenu" title="品牌、主题与显示选项">◐ 外观</button>
      </div>

      <div class="toolbar row2">
        <span class="set-title">显示设置</span>
        <div class="set-group">
          <label class="hint" for="selPad">时间轴</label>
          <select id="selPad" class="field">
            <option value="exact">仅覆盖任务区间</option>
            <option value="month">对齐整月</option>
            <option value="week">前后各留一周</option>
            <option value="d1">前后各留 1 天</option>
            <option value="d3">前后各留 3 天</option>
          </select>
        </div>
        <div class="set-group">
          <label class="hint" for="selStep">每格</label>
          <select id="selStep" class="field">
            <option value="1">1 天</option>
            <option value="2">2 天</option>
            <option value="3">3 天</option>
            <option value="7">1 周</option>
          </select>
        </div>
        <div class="set-group">
          <label class="hint" for="selW">日宽</label>
          <input id="selW" class="range" type="range" min="14" max="60" step="2" value="34">
          <span class="range-val" id="selWVal">34px</span>
        </div>
        <span class="spacer"></span>
        <button id="btnTheme" title="切换到深色主题">☾ 深色</button>
        <span class="save-state" id="saveState">已保存</span>
      </div>

      <div class="title-bar">
        <div class="brand">
          <img class="brand-logo" id="brandLogo" alt="LOGO">
          <div class="brand-text">
            <div class="brand-name" id="brandName">工期预排</div>
            <div class="brand-sub" id="brandSub">甘特式自动排期</div>
          </div>
        </div>
        <h1 id="docTitle" contenteditable="true" spellcheck="false">工期预排表</h1>
      </div>

      <div class="chart-wrap" id="chartWrap">
        <div class="gantt" id="gantt"></div>
      </div>

      <div class="remark-wrap">
        <div class="remark-label">
          <span>备注</span>
          <span class="rstatus" id="remarkStatus">自动保存</span>
        </div>
        <textarea id="remarkBox" class="remark-box"
          placeholder="在这里写临时备注，甲方双方需要注意及要完成的内容，会自动保存在当前项目里。"></textarea>
      </div>

      <div class="footer">
        <span id="stat"></span><span id="warn"></span>
        <span class="spacer"></span>
        <span class="hint">拖日期格拉出任务 · 拖甘特条整体移位 · 拖条两端改工期 · 点条换色 · Ctrl+Z 撤销</span>
      </div>
    </div>
  </main>
</div>

<div class="print-root" id="printRoot"></div>

<div class="toast-root" id="toastRoot" aria-live="polite"></div>
<div class="menu-pop" id="menuPop" hidden></div>
<div class="dlg-mask" id="dlgMask" hidden>
  <div class="dlg" id="dlgBox" role="dialog" aria-modal="true"></div>
</div>

</body>
</html>
